# prj.conf

# Wifi config
CONFIG_WIFI=y  #Enables the general Wi-Fi drivers in the application
CONFIG_WIFI_NM_WPA_SUPPLICANT=y  #Enables WPA (Wi-Fi Protected Access) supplicant as 
                                 #the network management backend for WIFI_NM. The WPA supplicant is primarily responsible for implementing the authentication phase of WPA, as well as network scanning, key exchange and roaming support.

# Network Management API Configuration
CONFIG_NETWORKING=y
CONFIG_NET_MGMT=y    #Adds the Network Management API
CONFIG_NET_MGMT_EVENT=y  #Adds support for runtime network event notifications
CONFIG_NET_MGMT_EVENT_INFO=y   #Adds supports for passing information along with an event 
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y


#Add Socket Support
CONFIG_NET_SOCKETS=y


# Connection Manager
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=5200
CONFIG_L2_WIFI_CONNECTIVITY=y
CONFIG_L2_WIFI_CONNECTIVITY_AUTO_CONNECT=n


# Home Wi-Fi credentials - development only
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_STATIC=y


#Logging
CONFIG_LOG=y


#Magic number alert:
#Needed to increase main stack size to fix a stack overflow issue when calling Zephyr networking functions
#Stack size of 16384 is working fine for now, but warrants more investigation later
CONFIG_MAIN_STACK_SIZE=16384 